<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Override | Akhand Pratap Singh</title>
  <!-- Google Fonts for Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #e11d48;
      --accent-soft: rgba(225, 29, 72, 0.1);
      --border-light: rgba(15, 23, 42, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      /* Subtle premium light mesh & grid background */
      background-image: 
        radial-gradient(at 20% 20%, rgba(225, 29, 72, 0.07) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(59, 130, 246, 0.07) 0px, transparent 50%),
        linear-gradient(to right, rgba(15, 23, 42, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      color: var(--text-main);
      padding: 24px;
    }

    .card {
      max-width: 540px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-light);
      border-radius: 28px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 
        0 20px 50px -12px rgba(15, 23, 42, 0.08),
        0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 28px 60px -12px rgba(15, 23, 42, 0.12),
        0 0 0 1px rgba(255, 255, 255, 0.9) inset;
    }

    /* Live Alert Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 999px;
      margin-bottom: 28px;
      border: 1px solid rgba(225, 29, 72, 0.2);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(225, 29, 72, 0); }
      100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }

    /* Profile Image Container */
    .avatar-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto 28px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, #0f172a 0%, #e11d48 100%);
      box-shadow: 0 14px 30px rgba(225, 29, 72, 0.18);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ffffff;
      display: block;
      background-color: #e2e8f0;
    }

    .subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.95rem;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 14px;
    }

    h1 span {
      background: linear-gradient(135deg, #0f172a 0%, #e11d48 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block;
      margin-top: 4px;
    }

    p.description {
      font-size: 0.98rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    /* Terminal Style Footer Box */
    .terminal-bar {
      background: #f1f5f9;
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #334155;
    }

    .terminal-dots {
      display: flex;
      gap: 6px;
    }

    .terminal-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    @media (max-width: 480px) {
      .card {
        padding: 36px 22px;
      }
      h1 {
        font-size: 1.55rem;
      }
      .avatar-wrapper {
        width: 125px;
        height: 125px;
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="status-badge">
      <span class="pulse-dot"></span>
      System Access Active
    </div>

    <div class="avatar-wrapper">
      <img src="image.jpg" alt="Akhand Pratap Singh" />
    </div>

    <div class="subtitle">Security Override Notice</div>
    
    <h1>
      Website Hacked By
      <span>Akhand Pratap Singh</span>
    </h1>

    <p class="description">
      Root access established. All systems and domain configurations are currently under administrative control.
    </p>

    <div class="terminal-bar">
      <div class="terminal-dots">
        <span class="dot-red"></span>
        <span class="dot-yellow"></span>
        <span class="dot-green"></span>
      </div>
      <span>root@system:~# status --verified</span>
    </div>
  </main>

</body>
</html>
